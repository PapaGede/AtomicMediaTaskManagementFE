<div class="task-form-container">
  <h1>{{ isEdit ? 'Edit Task' : 'Create Task' }}</h1>

  <mat-card>
    <mat-card-content>
      <mat-spinner *ngIf="loading" diameter="40" class="center-spinner"></mat-spinner>

      <form [formGroup]="form" (ngSubmit)="onSubmit()" *ngIf="!loading || isEdit">
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Title</mat-label>
          <input matInput formControlName="title" placeholder="Enter task title">
          <mat-error *ngIf="form.get('title')?.hasError('required')">
            Title is required
          </mat-error>
          <mat-error *ngIf="form.get('title')?.hasError('maxlength')">
            Title must be 100 characters or less
          </mat-error>
        </mat-form-field>

        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Description</mat-label>
          <textarea matInput formControlName="description" placeholder="Enter task description"
                    rows="4"></textarea>
        </mat-form-field>

        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Assigned To</mat-label>
          <input matInput formControlName="assignedTo" placeholder="Enter assignee name">
        </mat-form-field>

        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Due Date</mat-label>
          <input matInput [matDatepicker]="picker" formControlName="dueDate">
          <mat-datepicker-toggle matIconSuffix [for]="picker"></mat-datepicker-toggle>
          <mat-datepicker #picker></mat-datepicker>
        </mat-form-field>

        <mat-checkbox formControlName="completed" color="primary" *ngIf="isEdit"
                      class="completed-checkbox">
          Mark as completed
        </mat-checkbox>

        <div class="actions">
          <button mat-button type="button" (click)="onCancel()">Cancel</button>
          <button mat-raised-button color="primary" type="submit" [disabled]="loading">
            {{ isEdit ? 'Update' : 'Create' }}
          </button>
        </div>
      </form>
    </mat-card-content>
  </mat-card>
</div>
